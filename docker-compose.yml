version: "3.8"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: ops_crew_backend
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - OPENAI_MODEL_NAME=${OPENAI_MODEL_NAME:-gpt-4o-mini}
      - TAVILY_API_KEY=${TAVILY_API_KEY:-}
      - SQLITE_DB_PATH=/app/data/ops_crew_checkpoints.db
    volumes:
      - ops_crew_data:/app/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 3
    restart: unless-stopped
    networks:
      - ops_crew_net

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: ops_crew_frontend
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_started
    restart: unless-stopped
    networks:
      - ops_crew_net

volumes:
  ops_crew_data:
    driver: local

networks:
  ops_crew_net:
    driver: bridge
